
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .ag-wrap { background: #f0f7f2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 390px; min-height: 100vh; margin: 0 auto; padding-bottom: 40px; }
  .ag-header { background: #fff; padding: 14px 18px 18px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; border-bottom: 0.5px solid rgba(27,94,59,0.12); display: flex; align-items: center; gap: 12px; }
  .ag-back { width: 36px; height: 36px; border-radius: 10px; background: #E8F5E9; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; border: none; }
  .ag-back i { font-size: 18px; color: #1B5E3B; }
  .ag-header-title { font-size: 18px; font-weight: 700; color: #1B5E3B; flex: 1; }
  .ag-section { background: #fff; border-radius: 20px; margin: 12px 16px 0; overflow: hidden; }
  .ag-section-title { font-size: 11px; font-weight: 700; color: #7a9e8a; letter-spacing: 0.5px; text-transform: uppercase; padding: 14px 18px 4px; }
  .ag-field { padding: 10px 18px; border-top: 0.5px solid rgba(27,94,59,0.07); }
  .ag-field:first-of-type { border-top: none; }
  .ag-field-label { font-size: 11px; font-weight: 700; color: #7a9e8a; margin-bottom: 6px; letter-spacing: 0.3px; }
  .ag-input { width: 100%; background: #f0f7f2; border: 0.5px solid rgba(27,94,59,0.15); border-radius: 10px; padding: 10px 13px; font-size: 14px; color: #2d4e39; outline: none; font-family: inherit; }
  .ag-input:focus { border-color: #1B5E3B; background: #fff; }
  .ag-textarea { width: 100%; background: #f0f7f2; border: 0.5px solid rgba(27,94,59,0.15); border-radius: 10px; padding: 10px 13px; font-size: 13px; color: #2d4e39; outline: none; font-family: inherit; resize: none; line-height: 1.5; }
  .ag-textarea:focus { border-color: #1B5E3B; background: #fff; }
  .ag-actions { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px; }
  .ag-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
  .ag-btn-primary { background: #1B5E3B; color: #E8F5E9; }
  .ag-btn-outline { background: transparent; color: #1B5E3B; border: 1.5px solid rgba(27,94,59,0.25) !important; }
  .ag-btn i { font-size: 17px; }
  .ag-avatar-hero { display: flex; flex-direction: column; align-items: center; padding: 22px 20px 16px; }
  .ag-avatar-xl { width: 68px; height: 68px; border-radius: 50%; background: #1B5E3B; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #E8F5E9; margin-bottom: 8px; }
  .ag-avatar-hint { font-size: 12px; color: #7a9e8a; font-weight: 500; }
</style>

<div class="ag-wrap">
  <h2 class="sr-only">Editar cliente — Andrea Gómez — Agendia</h2>

  <div class="ag-header">
    <button class="ag-back" aria-label="Volver">
      <i class="ti ti-chevron-left" aria-hidden="true"></i>
    </button>
    <span class="ag-header-title">Editar cliente</span>
  </div>

  <div class="ag-avatar-hero">
    <div class="ag-avatar-xl">A</div>
    <span class="ag-avatar-hint">Andrea Gómez</span>
  </div>

  <div class="ag-section">
    <p class="ag-section-title">Datos personales</p>
    <div class="ag-field">
      <div class="ag-field-label">Nombre completo</div>
      <input class="ag-input" type="text" value="Andrea Gómez" aria-label="Nombre completo" />
    </div>
    <div class="ag-field">
      <div class="ag-field-label">Teléfono</div>
      <input class="ag-input" type="tel" value="+54 9 11 4523-0987" aria-label="Teléfono" />
    </div>
    <div class="ag-field">
      <div class="ag-field-label">Dirección</div>
      <input class="ag-input" type="text" value="Av. Rivadavia 4521, CABA" aria-label="Dirección" />
    </div>
    <div class="ag-field">
      <div class="ag-field-label">Observaciones</div>
      <textarea class="ag-textarea" rows="3" aria-label="Observaciones">Entra por la puerta lateral. Timbre nombre "Gómez". Llegar 5 min antes los lunes.</textarea>
    </div>
  </div>

  <div class="ag-actions">
    <button class="ag-btn ag-btn-primary">
      <i class="ti ti-check" aria-hidden="true"></i>
      Guardar cambios
    </button>
    <button class="ag-btn ag-btn-outline">
      Cancelar
    </button>
  </div>

</div>
