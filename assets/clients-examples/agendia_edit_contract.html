
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .ag-wrap { background: #f0f7f2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 390px; min-height: 100vh; margin: 0 auto; padding-bottom: 40px; }
  .ag-header { background: #fff; padding: 14px 18px 18px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; border-bottom: 0.5px solid rgba(27,94,59,0.12); display: flex; align-items: center; gap: 12px; }
  .ag-back { width: 36px; height: 36px; border-radius: 10px; background: #E8F5E9; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; border: none; }
  .ag-back i { font-size: 18px; color: #1B5E3B; }
  .ag-header-title { font-size: 18px; font-weight: 700; color: #1B5E3B; flex: 1; }
  .ag-section { background: #fff; border-radius: 20px; margin: 12px 16px 0; overflow: hidden; }
  .ag-section-title { font-size: 11px; font-weight: 700; color: #7a9e8a; letter-spacing: 0.5px; text-transform: uppercase; padding: 14px 18px 10px; }
  .ag-field { padding: 6px 18px 10px; border-top: 0.5px solid rgba(27,94,59,0.07); }
  .ag-field-label { font-size: 11px; font-weight: 700; color: #7a9e8a; margin-bottom: 6px; letter-spacing: 0.3px; }
  .ag-input { width: 100%; background: #f0f7f2; border: 0.5px solid rgba(27,94,59,0.15); border-radius: 10px; padding: 10px 13px; font-size: 14px; color: #2d4e39; outline: none; font-family: inherit; }
  .ag-input:focus { border-color: #1B5E3B; background: #fff; }
  .ag-select { width: 100%; background: #f0f7f2; border: 0.5px solid rgba(27,94,59,0.15); border-radius: 10px; padding: 10px 13px; font-size: 14px; color: #2d4e39; outline: none; font-family: inherit; appearance: none; cursor: pointer; }
  .ag-select:focus { border-color: #1B5E3B; background: #fff; }
  .ag-radio-group { display: flex; flex-direction: column; gap: 6px; padding: 4px 18px 14px; }
  .ag-radio-opt { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; cursor: pointer; border: 1.5px solid rgba(27,94,59,0.12); background: #f0f7f2; transition: all 0.1s; }
  .ag-radio-opt.selected { background: #E8F5E9; border-color: #1B5E3B; }
  .ag-radio-circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c0d4c8; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ag-radio-opt.selected .ag-radio-circle { border-color: #1B5E3B; background: #1B5E3B; }
  .ag-radio-dot { width: 7px; height: 7px; border-radius: 50%; background: #E8F5E9; }
  .ag-radio-label { font-size: 14px; font-weight: 500; color: #4a6a58; }
  .ag-radio-opt.selected .ag-radio-label { color: #1B5E3B; font-weight: 600; }

  .ag-sched-table { padding: 0 18px 14px; }
  .ag-sched-cols { display: grid; grid-template-columns: 80px 1fr 1fr 32px; gap: 6px; padding: 0 0 6px; }
  .ag-sched-col-label { font-size: 10px; font-weight: 700; color: #c0d4c8; text-transform: uppercase; letter-spacing: 0.5px; }
  .ag-sched-row { display: grid; grid-template-columns: 80px 1fr 1fr 32px; gap: 6px; align-items: center; padding: 5px 0; border-top: 0.5px solid rgba(27,94,59,0.06); }
  .ag-sched-select { width: 100%; background: #f0f7f2; border: 0.5px solid rgba(27,94,59,0.15); border-radius: 8px; padding: 7px 6px; font-size: 12px; color: #2d4e39; outline: none; font-family: inherit; appearance: none; cursor: pointer; }
  .ag-sched-input { width: 100%; background: #f0f7f2; border: 0.5px solid rgba(27,94,59,0.15); border-radius: 8px; padding: 7px 6px; font-size: 12px; color: #2d4e39; outline: none; font-family: inherit; text-align: center; }
  .ag-sched-input:focus, .ag-sched-select:focus { border-color: #1B5E3B; background: #fff; }
  .ag-sched-del { width: 28px; height: 28px; border-radius: 8px; border: none; background: rgba(192,57,43,0.08); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ag-sched-del i { font-size: 14px; color: #c0392b; }
  .ag-add-sched { display: flex; align-items: center; gap: 8px; padding: 10px 18px 14px; cursor: pointer; border-top: 0.5px solid rgba(27,94,59,0.07); }
  .ag-add-icon { width: 28px; height: 28px; border-radius: 50%; border: 1.5px dashed rgba(27,94,59,0.25); display: flex; align-items: center; justify-content: center; }
  .ag-add-icon i { font-size: 14px; color: #1B5E3B; }
  .ag-add-label { font-size: 13px; font-weight: 600; color: #1B5E3B; }
  .ag-actions { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px; }
  .ag-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
  .ag-btn-primary { background: #1B5E3B; color: #E8F5E9; }
  .ag-btn-outline { background: transparent; color: #1B5E3B; border: 1.5px solid rgba(27,94,59,0.25) !important; }
  .ag-btn i { font-size: 17px; }
  .ag-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 18px 12px; border-top: 0.5px solid rgba(27,94,59,0.07); }
  .ag-two-col .ag-field-label { margin-bottom: 6px; }
</style>

<div class="ag-wrap">
  <h2 class="sr-only">Editar contrato — Andrea Gómez — Agendia</h2>

  <div class="ag-header">
    <button class="ag-back" aria-label="Volver">
      <i class="ti ti-chevron-left" aria-hidden="true"></i>
    </button>
    <span class="ag-header-title">Editar contrato</span>
  </div>

  <div class="ag-section" style="margin-top:16px;">
    <p class="ag-section-title">Facturación</p>
    <div class="ag-radio-group" id="billingGroup">
      <div class="ag-radio-opt" data-val="semanal">
        <div class="ag-radio-circle"></div>
        <span class="ag-radio-label">Semanal</span>
      </div>
      <div class="ag-radio-opt" data-val="quincenal">
        <div class="ag-radio-circle"></div>
        <span class="ag-radio-label">Quincenal</span>
      </div>
      <div class="ag-radio-opt selected" data-val="mensual">
        <div class="ag-radio-circle"><span class="ag-radio-dot"></span></div>
        <span class="ag-radio-label">Mensual</span>
      </div>
    </div>
    <div class="ag-two-col">
      <div>
        <div class="ag-field-label">Inicio de ciclo</div>
        <input class="ag-input" type="date" value="2026-06-01" aria-label="Inicio de ciclo" />
      </div>
      <div>
        <div class="ag-field-label">Día de cierre</div>
        <input class="ag-input" type="number" min="1" max="31" value="30" placeholder="30" aria-label="Día de cierre" />
      </div>
    </div>
  </div>

  <div class="ag-section">
    <p class="ag-section-title">Horarios habituales</p>
    <div class="ag-sched-table">
      <div class="ag-sched-cols">
        <span class="ag-sched-col-label">Día</span>
        <span class="ag-sched-col-label">Ida</span>
        <span class="ag-sched-col-label">Vuelta</span>
        <span></span>
      </div>
      <div id="schedRows">
        <div class="ag-sched-row">
          <select class="ag-sched-select" aria-label="Día">
            <option>Lunes</option><option>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
          </select>
          <input class="ag-sched-input" type="time" value="07:30" aria-label="Hora de ida" />
          <input class="ag-sched-input" type="time" value="16:00" aria-label="Hora de vuelta" />
          <button class="ag-sched-del" aria-label="Eliminar horario"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
        <div class="ag-sched-row">
          <select class="ag-sched-select" aria-label="Día">
            <option>Lunes</option><option selected>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
          </select>
          <input class="ag-sched-input" type="time" value="12:50" aria-label="Hora de ida" />
          <input class="ag-sched-input" type="time" placeholder="—" aria-label="Hora de vuelta" />
          <button class="ag-sched-del" aria-label="Eliminar horario"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
        <div class="ag-sched-row">
          <select class="ag-sched-select" aria-label="Día">
            <option>Lunes</option><option selected>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
          </select>
          <input class="ag-sched-input" type="time" value="14:05" aria-label="Hora de ida" />
          <input class="ag-sched-input" type="time" placeholder="—" aria-label="Hora de vuelta" />
          <button class="ag-sched-del" aria-label="Eliminar horario"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
        <div class="ag-sched-row">
          <select class="ag-sched-select" aria-label="Día">
            <option>Lunes</option><option>Martes</option><option>Miércoles</option><option>Jueves</option><option selected>Viernes</option><option>Sábado</option><option>Domingo</option>
          </select>
          <input class="ag-sched-input" type="time" value="08:15" aria-label="Hora de ida" />
          <input class="ag-sched-input" type="time" value="17:30" aria-label="Hora de vuelta" />
          <button class="ag-sched-del" aria-label="Eliminar horario"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
    <div class="ag-add-sched" id="addSchedBtn" role="button" tabindex="0" aria-label="Agregar horario">
      <div class="ag-add-icon"><i class="ti ti-plus" aria-hidden="true"></i></div>
      <span class="ag-add-label">Agregar horario</span>
    </div>
  </div>

  <div class="ag-actions">
    <button class="ag-btn ag-btn-primary">
      <i class="ti ti-check" aria-hidden="true"></i>
      Guardar cambios
    </button>
    <button class="ag-btn ag-btn-outline">Cancelar</button>
  </div>

</div>

<script>
  document.querySelectorAll('.ag-radio-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.ag-radio-opt').forEach(o => {
        o.classList.remove('selected');
        o.querySelector('.ag-radio-circle').innerHTML = '';
      });
      opt.classList.add('selected');
      opt.querySelector('.ag-radio-circle').innerHTML = '<span class="ag-radio-dot"></span>';
    });
  });

  document.querySelectorAll('.ag-sched-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const rows = document.querySelectorAll('.ag-sched-row');
      if (rows.length > 1) btn.closest('.ag-sched-row').remove();
    });
  });

  document.getElementById('addSchedBtn').addEventListener('click', () => {
    const row = document.createElement('div');
    row.className = 'ag-sched-row';
    row.innerHTML = `
      <select class="ag-sched-select" aria-label="Día">
        <option>Lunes</option><option>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
      </select>
      <input class="ag-sched-input" type="time" aria-label="Hora de ida" />
      <input class="ag-sched-input" type="time" aria-label="Hora de vuelta" />
      <button class="ag-sched-del" aria-label="Eliminar horario"><i class="ti ti-trash" aria-hidden="true"></i></button>
    `;
    row.querySelector('.ag-sched-del').addEventListener('click', () => {
      const rows = document.querySelectorAll('.ag-sched-row');
      if (rows.length > 1) row.remove();
    });
    document.getElementById('schedRows').appendChild(row);
  });
</script>
